# Production stack on one EC2 instance: app, web, Redis, Caddy.
# Postgres is Supabase (DATABASE_URL), same region as instance.

# Docker never rotates json-file logs by default.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    logging: *logging
    # AOF so BullMQ's job schedulers survive a restart.
    command: redis-server --appendonly yes
    mem_limit: 192m
    volumes:
      - redis_data:/data
    # Not published to the host: Redis has no auth.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    # Pinned to a commit SHA by the deploy.
    image: ${APP_IMAGE:-ghcr.io/88arya/wagerwolf-backend:latest}
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 5000
      # Session-mode pooler (5432).
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPORTSGAMEODDS_KEY: ${SPORTSGAMEODDS_KEY}
      # Empty unless a load test is running; see backend/.env.example.
      LOADTEST_KEY: ${LOADTEST_KEY:-}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUPPORT_FROM: ${SUPPORT_FROM:-}
      SUPPORT_INBOX: ${SUPPORT_INBOX:-}
      # Monitoring, both off when empty. See backend/.env.example.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      HEALTHCHECKS_PING_KEY: ${HEALTHCHECKS_PING_KEY:-}
    mem_limit: 640m
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Every service has a memory cap; the box has 2 GB.
  web:
    image: ${WEB_IMAGE:-ghcr.io/88arya/wagerwolf-frontend:latest}
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" serves plain HTTP while DNS propagates.
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-:80}
      # The site's own hostnames, same treatment. `www` only redirects.
      APP_DOMAIN: ${APP_DOMAIN:-:8080}
      WWW_DOMAIN: ${WWW_DOMAIN:-:8081}
      # Where www redirects to.
      CANONICAL_URL: ${CANONICAL_URL:-https://${APP_DOMAIN}}
      # Lets Go's GC react before the cgroup limit.
      GOMEMLIMIT: 200MiB
    mem_limit: 256m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin cert and key. Not in git; copied to the box separately.
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      # Don't accept traffic until the site can answer.
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
