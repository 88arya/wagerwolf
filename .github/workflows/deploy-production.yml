# Tag -> production.
#
# The gate is that a tag has to be cut by hand — this never fires on a push.
# A second gate (a required reviewer on the `production` Environment) is not
# available: protection rules are paid on private repos. See the `backend` job.
#
# This workflow does NOT migrate the database. `drizzle-kit push --force`
# auto-approves data-loss statements and this project has no migration history
# to roll back to, so schema changes go through db-push.yml — knowingly, and
# separately from shipping code.
name: Deploy · production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/wagerwolf-backend:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/$owner/wagerwolf-frontend:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # THE FRONTEND IS BUILT PER ENVIRONMENT, not built once and promoted.
      # NEXT_PUBLIC_* are string-substituted into the client bundle by the
      # compiler, so they cannot be injected at run time — the image IS the
      # configuration. That is why they are build args here and why there is no
      # NEXT_PUBLIC_* in docker-compose.yml.
      #
      # They come from Variables rather than Secrets: both are public by
      # definition, they end up in JavaScript every visitor downloads.
      #
      # Separate cache scopes, or the two builds evict each other's layers and
      # every deploy is a cold build of both.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.web_image }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.BACKEND_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # GHCR KEEPS EVERY IMAGE FOREVER OTHERWISE, and this is a PRIVATE repo, so
      # the free allowance is 500MB. The runtime image is ~180MB on node:22-alpine,
      # which means the third deploy starts costing money and it never stops
      # climbing. `deploy.sh` prunes on the instance, not in the registry — that
      # is a different thing and does not help here.
      #
      # Keeps 5, which is enough to roll back several deploys deep; images are
      # tagged by commit SHA and `latest` is never used, so "the last 5 pushed"
      # is the same as "the last 5 deployable".
      #
      # continue-on-error because a failed cleanup must never fail a deploy that
      # has already succeeded — the cost of not pruning is pennies, the cost of
      # a false red on a shipped release is confusion.
      - name: Prune old images from GHCR
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: wagerwolf-backend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Prune old frontend images from GHCR
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: wagerwolf-frontend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

  backend:
    name: Deploy backend (EC2)
    needs: image
    runs-on: ubuntu-latest
    # A required reviewer here would add an approval prompt, but Environment
    # protection rules are a PAID feature on private repos — unavailable on Free,
    # so the setting is not even rendered. The gate is the trigger instead: this
    # workflow fires on a `v*` tag or a manual dispatch, never on a push, so a
    # deploy is already a deliberate act rather than a consequence of merging.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Materialise .env
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          IMAGE: ${{ needs.image.outputs.image }}
          WEB_IMAGE: ${{ needs.image.outputs.web_image }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
        run: |
          printf '%s\n' "$BACKEND_ENV" > deploy/.env
          {
            echo "GIT_COMMIT_SHA=${GITHUB_SHA::7}"
            echo "APP_IMAGE=$IMAGE"
            echo "WEB_IMAGE=$WEB_IMAGE"
            echo "APP_DOMAIN=$APP_DOMAIN"
            echo "WWW_DOMAIN=$WWW_DOMAIN"
            echo "CANONICAL_URL=${{ vars.SITE_URL }}"
          } >> deploy/.env
          chmod 600 deploy/.env

      - name: Copy deploy files to the instance
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/*"
          target: /opt/wagerwolf
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/wagerwolf
            chmod +x deploy.sh
            # RUN_MIGRATIONS=0 — see the header. deploy.sh rolls back to the
            # previously-running image if the new one never reports healthy.
            APP_IMAGE="${{ needs.image.outputs.image }}" \
            WEB_IMAGE="${{ needs.image.outputs.web_image }}" \
            RUN_MIGRATIONS=0 bash deploy.sh

      - name: Verify from the public internet
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BACKEND_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "Reachable."; curl -s "$BACKEND_URL/health"; exit 0
            fi
            echo "attempt $i: HTTP $code"; sleep 5
          done
          echo "::error::Backend healthy on the box but unreachable at $BACKEND_URL"
          exit 1
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

  smoke:
    name: Smoke check
    needs: [backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      # The one unauthenticated read in the app. If this answers, Postgres is
      # reachable and the week data is real — more than /health proves, since
      # /health deliberately touches nothing.
      - name: Public week endpoint answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BACKEND_URL/weeks/public/current")
          echo "GET /weeks/public/current -> $code"
          test "$code" = "200"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

      # THE SITE ITSELF, which used to be Vercel's job to prove. Same box and
      # same Caddy as the API now, so a deploy that brings the API up and leaves
      # the site down is a state that can exist and has to be checked.
      - name: Site answers over HTTPS
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/" || true)
            if [ "$code" = "200" ]; then echo "Site reachable."; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 5
          done
          echo "::error::Site not reachable at $SITE_URL"
          exit 1
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Standalone builds ship `.next/static` and `public` as separate COPY
      # steps; miss either and the site serves HTML with no CSS and no images,
      # which returns 200 and looks fine to a health check. Assert a real asset.
      - name: Static assets are served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/logo.svg")
          echo "GET /logo.svg -> $code"
          test "$code" = "200"
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: CORS is restricted
        run: |
          # FRONTEND_URL unset means cors() reflects any origin. Catch that here
          # rather than in a report from someone else.
          hdr=$(curl -s -I -H "Origin: https://not-the-frontend.invalid" \
            "$BACKEND_URL/health" | grep -i "access-control-allow-origin" || true)
          if echo "$hdr" | grep -qi "not-the-frontend.invalid"; then
            echo "::error::Backend reflected an arbitrary Origin — FRONTEND_URL is not set"
            exit 1
          fi
          echo "OK — arbitrary origin not reflected"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

      # Redis is not published to the host by docker-compose.yml, and it runs
      # with no auth precisely because nothing off the compose network can reach
      # it. If it answers from the internet, that assumption is false and the
      # job queue is world-writable.
      #
      # 5432 is checked too even though Postgres is Supabase: nothing should be
      # listening on it here, and a stray port mapping is exactly the kind of
      # thing this catches.
      - name: Datastores are not publicly exposed
        run: |
          for port in 6379 5432; do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/$port" 2>/dev/null; then
              echo "::error::Port $port is reachable on $EC2_HOST — it must not be"
              exit 1
            fi
            echo "port $port closed"
          done
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
