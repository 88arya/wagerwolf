# Deploys production when a v* tag is pushed (or manually).
name: Deploy · production

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v7

      # version: latest - the default BuildKit still uses the retired GHA cache API.
      - uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/wagerwolf-backend:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/$owner/wagerwolf-frontend:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      # Frontend is built per environment: NEXT_PUBLIC_* values are compiled in.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.web_image }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.BACKEND_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN_WEB }}
            NEXT_PUBLIC_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend,ignore-error=true

      # GHCR keeps every image and the private-repo allowance is 500MB.
      - name: Prune old images from GHCR
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: wagerwolf-backend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Prune old frontend images from GHCR
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: wagerwolf-frontend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

  backend:
    name: Deploy backend (EC2)
    needs: image
    runs-on: ubuntu-latest
    # packages: read is needed to pull from GHCR.
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Materialise .env
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          IMAGE: ${{ needs.image.outputs.image }}
          WEB_IMAGE: ${{ needs.image.outputs.web_image }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          WWW_DOMAIN: ${{ vars.WWW_DOMAIN }}
          # Separate secret so it can be added or removed without rewriting BACKEND_ENV.
          LOADTEST_KEY: ${{ secrets.LOADTEST_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
        run: |
          printf '%s\n' "$BACKEND_ENV" > deploy/.env
          {
            echo "GIT_COMMIT_SHA=${GITHUB_SHA::7}"
            echo "APP_IMAGE=$IMAGE"
            echo "WEB_IMAGE=$WEB_IMAGE"
            echo "APP_DOMAIN=$APP_DOMAIN"
            echo "WWW_DOMAIN=$WWW_DOMAIN"
            echo "CANONICAL_URL=${{ vars.SITE_URL }}"
            # Only write it when set, so the bypass is absent by default.
            if [ -n "$LOADTEST_KEY" ]; then echo "LOADTEST_KEY=$LOADTEST_KEY"; fi
            if [ -n "$SENTRY_DSN" ]; then echo "SENTRY_DSN=$SENTRY_DSN"; fi
            if [ -n "$HEALTHCHECKS_PING_KEY" ]; then echo "HEALTHCHECKS_PING_KEY=$HEALTHCHECKS_PING_KEY"; fi
          } >> deploy/.env
          chmod 600 deploy/.env

      - name: Copy deploy files to the instance
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/*"
          target: /opt/wagerwolf
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/wagerwolf
            chmod +x deploy.sh
            # deploy.sh rolls back if the new image never reports healthy.
            APP_IMAGE="${{ needs.image.outputs.image }}" \
            WEB_IMAGE="${{ needs.image.outputs.web_image }}" \
            RUN_MIGRATIONS=0 bash deploy.sh

      - name: Verify from the public internet
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BACKEND_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "Reachable."; curl -s "$BACKEND_URL/health"; exit 0
            fi
            echo "attempt $i: HTTP $code"; sleep 5
          done
          echo "::error::Backend healthy on the box but unreachable at $BACKEND_URL"
          exit 1
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

  smoke:
    name: Smoke check
    needs: [backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Unauthenticated and hits Postgres, unlike /health.
      - name: Public week endpoint answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BACKEND_URL/weeks/public/current")
          echo "GET /weeks/public/current -> $code"
          test "$code" = "200"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

      - name: Site answers over HTTPS
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/" || true)
            if [ "$code" = "200" ]; then echo "Site reachable."; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 5
          done
          echo "::error::Site not reachable at $SITE_URL"
          exit 1
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      # Standalone builds copy static assets separately; make sure they're served.
      - name: Static assets are served
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/logo.svg")
          echo "GET /logo.svg -> $code"
          test "$code" = "200"
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: CORS is restricted
        run: |
          # FRONTEND_URL unset would reflect any origin.
          hdr=$(curl -s -I -H "Origin: https://not-the-frontend.invalid" \
            "$BACKEND_URL/health" | grep -i "access-control-allow-origin" || true)
          if echo "$hdr" | grep -qi "not-the-frontend.invalid"; then
            echo "::error::Backend reflected an arbitrary Origin — FRONTEND_URL is not set"
            exit 1
          fi
          echo "OK — arbitrary origin not reflected"
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

      # Redis and Postgres ports must not be reachable from the internet.
      - name: Datastores are not publicly exposed
        run: |
          for port in 6379 5432; do
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/$port" 2>/dev/null; then
              echo "::error::Port $port is reachable on $EC2_HOST — it must not be"
              exit 1
            fi
            echo "port $port closed"
          done
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
