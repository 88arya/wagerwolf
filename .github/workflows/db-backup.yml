# Nightly pg_dump to S3. Supabase's free tier has no backups, so this is the only one.
name: Database · nightly backup

on:
  schedule:
    # 09:00 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: production
        options: [staging, production]

concurrency:
  group: db-backup-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Back up ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    # Scheduled runs have no inputs, so default to production.
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Dump and upload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          envs: BACKUP_BUCKET
          script: |
            set -euo pipefail
            cd /opt/wagerwolf
            # Use the same DATABASE_URL the app is running with.
            set -a; . ./.env; set +a

            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            file="backups/wagerwolf-$stamp.sql.gz"
            mkdir -p backups

            # Throwaway postgres image so the client version is pinned.
            docker run --rm postgres:18-alpine \
              pg_dump "$DATABASE_URL" --clean --if-exists \
              | gzip > "$file"

            size=$(stat -c%s "$file")
            echo "Dumped $file ($size bytes)"

            # A gzip of a failed dump is still a few hundred bytes.
            if [ "$size" -lt 1024 ]; then
              echo "Dump is implausibly small — treating as failed" >&2
              exit 1
            fi

            gzip -t "$file"

            if [ -n "${BACKUP_BUCKET:-}" ]; then
              aws s3 cp "$file" "s3://$BACKUP_BUCKET/$(basename "$file")"
              echo "Uploaded to s3://$BACKUP_BUCKET/"
            else
              echo "::error::BACKUP_BUCKET is not set — the dump stayed on the instance, which is not a backup"
              exit 1
            fi

            # Keep a week locally; S3 lifecycle handles retention.
            ls -1t backups/*.sql.gz | tail -n +8 | xargs -r rm --
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
