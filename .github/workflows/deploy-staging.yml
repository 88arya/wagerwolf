# Staging deploy, manual only. There is no permanent staging instance.
name: Deploy · staging

on:
  workflow_dispatch:

# Never cancel a deploy in flight.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase repository paths.
      - name: Compute image reference
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/wagerwolf-backend:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend:
    name: Deploy backend (EC2)
    needs: image
    runs-on: ubuntu-latest
    # packages: read is needed to pull from GHCR.
    permissions:
      contents: read
      packages: read
    environment: staging
    steps:
      - uses: actions/checkout@v7

      # BACKEND_ENV holds the whole .env file as one secret.
      - name: Materialise .env
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          printf '%s\n' "$BACKEND_ENV" > deploy/.env
          {
            echo "GIT_COMMIT_SHA=${GITHUB_SHA::7}"
            echo "APP_IMAGE=$IMAGE"
          } >> deploy/.env
          chmod 600 deploy/.env
          echo "Wrote $(wc -l < deploy/.env) lines"

      # Ship the compose file, Caddyfile and deploy script from this commit.
      - name: Copy deploy files to the instance
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/*"
          target: /opt/wagerwolf
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: APP_IMAGE
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/wagerwolf
            chmod +x deploy.sh
            # Staging migrates on every deploy; production uses db-push.yml.
            APP_IMAGE="${{ needs.image.outputs.image }}" RUN_MIGRATIONS=1 bash deploy.sh
        env:
          APP_IMAGE: ${{ needs.image.outputs.image }}

      # Checks security group, Caddy and DNS from outside the box.
      - name: Verify from the public internet
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BACKEND_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "Reachable."; curl -s "$BACKEND_URL/health"; exit 0
            fi
            echo "attempt $i: HTTP $code"; sleep 5
          done
          echo "::error::Backend healthy on the box but unreachable at $BACKEND_URL"
          exit 1
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}

