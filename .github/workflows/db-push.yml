# Manual schema push (drizzle-kit push). Takes a dump first, since there are
# no migrations to roll back.
name: Database · push schema

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: staging
        options: [staging, production]
      confirm:
        description: Type the environment name again to confirm
        type: string
        required: true
      force:
        description: "Pass --force (auto-approves DATA LOSS). Leave off unless you have read the plan."
        type: boolean
        default: false

concurrency:
  group: db-push-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: Push schema to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Type the environment name to confirm.
      - name: Confirm target
        run: |
          if [ "$CONFIRM" != "$TARGET" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match target '$TARGET'"
            exit 1
          fi
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.environment }}

      - name: Back up the database first
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/wagerwolf
            set -a; . ./.env; set +a

            mkdir -p backups
            stamp=$(date -u +%Y%m%dT%H%M%SZ)
            file="backups/pre-migrate-$stamp.sql.gz"

            docker run --rm postgres:18-alpine \
              pg_dump "$DATABASE_URL" --clean --if-exists \
              | gzip > "$file"

            size=$(stat -c%s "$file")
            echo "Dumped $file ($size bytes)"
            [ "$size" -ge 1024 ] || { echo "Dump implausibly small — aborting" >&2; exit 1; }
            gzip -t "$file"

            if [ -n "${BACKUP_BUCKET:-}" ]; then
              aws s3 cp "$file" "s3://$BACKUP_BUCKET/$(basename "$file")"
            fi

            # Keep the last 10 locally.
            ls -1t backups/*.sql.gz | tail -n +11 | xargs -r rm --
          envs: BACKUP_BUCKET
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}

      - name: drizzle-kit push
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /opt/wagerwolf
            # Without --force, drizzle-kit refuses changes it considers destructive.
            FORCE=""
            if [ "${{ inputs.force }}" = "true" ]; then
              FORCE="--force"
              echo "::warning::Running with --force — data-loss statements are auto-approved"
            fi
            # Run inside the deployed image so the schema matches the running code.
            docker compose run --rm --no-deps -T app npx drizzle-kit push $FORCE
